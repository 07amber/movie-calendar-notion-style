<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Movie Calendar (TMDB)</title>
    <style>
    :root{
  --bg: #ffffff;
  --panel: #ffffff;
  --panel2: #f7f7f5;
  --text: #37352f;
  --muted: #787774;
  --border: #e9e9e7;
  --shadow: none;
  --radius: 8px;

  --mainland: #4f7cff;
  --hk: #9b6bff;
}

      *{ box-sizing: border-box; }
     body{
  margin:0;
  background: var(--bg);
  color: var(--text);
}
      .wrap{
        max-width: 1200px;
        margin: 28px auto 60px;
        padding: 0 18px;
      }
      header{
        display:flex;
        align-items:flex-end;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 16px;
      }
      h1{
        margin:0;
        font-size: 22px;
        letter-spacing: 0.2px;
      }
      .sub{
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.4;
      }
      .controls{
  background: transparent;
  border: none;
  box-shadow: none;
  padding: 0;
}
      .filters{
        display:flex;
        gap: 12px;
        align-items:center;
        flex-wrap: wrap;
      }
      .pill{
        display:flex;
        gap: 10px;
        align-items:center;
        padding: 8px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255,255,255,0.04);
        user-select:none;
      }
      .pill input{ transform: scale(1.1); }
      .badge{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        font-size: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
      }
      .badge.mainland{ background: rgba(59,130,246,0.16); color: #93c5fd; border-color: rgba(59,130,246,0.35); }
      .badge.hk{ background: rgba(168,85,247,0.14); color: #d8b4fe; border-color: rgba(168,85,247,0.32); }
      .legend{
        display:flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .monthGrid{
        display:grid;
        gap: 18px;
        margin-top: 18px;
      }

      .month{
  border: 1px solid var(--border);
  background: var(--panel);
  border-radius: 10px;
  box-shadow: none;
}
      .monthHead{
  background: transparent;
  border-bottom: 1px solid var(--border);
}
      .monthTitle{
        font-size: 18px;
        font-weight: 700;
      }
      .monthMeta{
        color: var(--muted);
        font-size: 13px;
      }

      .dow{
        display:grid;
        grid-template-columns: repeat(7, 1fr);
        padding: 12px 14px 0;
        gap: 8px;
      }
      .dow div{
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
      }

      .days{
        display:grid;
        grid-template-columns: repeat(7, 1fr);
        padding: 10px 14px 16px;
        gap: 8px;
      }

      .day{
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 8px;
}
      .day:hover{
  background: #f7f7f5;
}
      .day.muted{
        opacity: 0.55;
        background: rgba(0,0,0,0.05);
      }

      .dayNumRow{
        display:flex;
        align-items:center;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
      }
      .dayNum{
        font-weight: 650;
        font-size: 14px;
      }
      .count{
        color: var(--muted);
        font-size: 12px;
      }
      .today{
        outline: 2px solid rgba(16,185,129,0.45);
        box-shadow: 0 0 0 4px rgba(16,185,129,0.10);
      }

     .card{
  display:flex;
  flex-direction: column;   /* 关键：改为纵向 */
  gap: 6px;
  padding: 8px;
}
      .card{
  background: transparent;
  border: none;
  padding: 4px 0;
  border-radius: 0;
}
      .card img{
         width: 100%;
  height: auto;
  aspect-ratio: 2 / 3;
        object-fit: cover;
        border-radius: 10px;
        background: rgba(255,255,255,0.05);
        flex: 0 0 auto;
      }
      .card .info{
        flex: 1 1 auto;
        min-width: 0;
      }
      .t{
        display:flex;
        align-items:flex-start;
        justify-content: space-between;
        gap: 10px;
      }
     .title{
  font-size: 13px;
  font-weight: 500;
}

.title small{
  font-size: 12px;
  color: var(--muted);
}
      .regionTag{
  font-size: 10px;
  padding: 2px 6px;
  border-radius: 6px;
  background: #f1f1ef;
  border: none;
  color: var(--muted);
}
      .regionTag.mainland{ background: rgba(59,130,246,0.18); color: #93c5fd; border-color: rgba(59,130,246,0.35); }
      .regionTag.hk{ background: rgba(168,85,247,0.14); color: #d8b4fe; border-color: rgba(168,85,247,0.32); }


      .footNote{
        margin-top: 16px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
        text-align:center;
      }

      @media (max-width: 980px){
        .day{ min-height: 96px; }
      }
      @media (max-width: 760px){
        .dow{ padding-left: 10px; padding-right: 10px; }
        .days{ padding-left: 10px; padding-right: 10px; }
      }
      @media (max-width: 640px){
  .title,
  .regionTag{
    display:none;
  }

  .card{
    padding:0;
  }
}
      .cardLink{
  display: block;
  color: inherit;
  text-decoration: none;
}
      
.cardLink:hover .card{
  background: #f7f7f5;
}
      
    </style>

    <script>
      const MOVIES = window.MOVIES || [];
      const expandedDays = new Set();

const renderCards = (cards, dateStr) => {
  const filtered = cards.filter(c => {
    const rk = regionKey(c.region);
    if (rk === 'mainland') return showMainland();
    if (rk === 'hk') return showHK();
    return true;
  });

  const isExpanded = expandedDays.has(dateStr);

  const cap = isExpanded ? filtered.length : 3;
  const shown = filtered.slice(0, cap);
  const extra = filtered.length - shown.length;

  return `
    ${shown.map(c => {
      const rk = regionKey(c.region);
      const tagClass = rk === 'mainland' ? 'mainland' : (rk === 'hk' ? 'hk' : '');
      const poster = c.poster || '';
      const titleLocal = c.title_local || c.title_en || '';
      const titleEn = c.title_en ? c.title_en : '';
      const link = c.link || '#';

      return `
  <a href="${link}" target="_blank" rel="noreferrer noopener" class="cardLink">

    <div class="card">
      <img src="${poster}" alt="${escHtml(titleLocal)}" loading="lazy" />

      <div class="info">
        <div class="t">
          <div class="title">
            ${escapeHtml(titleLocal)}
            <small>${escapeHtml(titleEn)}</small>
          </div>

          <div class="regionTag ${tagClass}">
            ${escapeHtml(c.region || '')}
          </div>
        </div>
      </div>
    </div>

  </a>
`;
    }).join('')}

    ${extra > 0 && !isExpanded 
      ? `<div class="moreBtn" data-date="${dateStr}" style="cursor:pointer; color: rgba(255,255,255,0.65); font-size: 12px;">+ ${extra} more</div>` 
      : ''}
  `;
};

      const regionKey = (r) => {
        if (r === 'Mainland China') return 'mainland';
        if (r === 'Hong Kong') return 'hk';
        return 'unknown';
      };

      const monthNameZh = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
      const dow = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];

      function pad2(n){ return String(n).padStart(2,'0'); }
      function ymKey(dateStr){
        const [y,m]=dateStr.split('-');
        return y + '-' + m;
      }
      function dayKey(dateStr){
        return dateStr;
      }

      function groupByMonth(movies){
        const g = new Map();
        for (const m of movies){
          if (!m || !m.release_date) continue;
          const k = ymKey(m.release_date);
          if (!g.has(k)) g.set(k, []);
          g.get(k).push(m);
        }
        // sort movies by date asc then region then title
        for (const [k, arr] of g.entries()){
          arr.sort((a,b)=> {
            if (a.release_date !== b.release_date) return a.release_date.localeCompare(b.release_date);
            const ra = (a.region||'').localeCompare(b.region||'');
            if (ra !== 0) return ra;
            return (a.title_en||'').localeCompare(b.title_en||'');
          });
        }
        return g;
      }

      const monthGrid = document.getElementById('monthGrid');

      function makeMonthCard({year, monthIndex0, movies}){
        const firstDay = new Date(year, monthIndex0, 1);
        // Monday start: 0..6
        const jsDow = firstDay.getDay(); // Sun=0..Sat=6
        const mondayIndex = (jsDow + 6) % 7;

        const lastDayNum = new Date(year, monthIndex0 + 1, 0).getDate();

        const monthEl = document.createElement('section');
        monthEl.className = 'month';

        const monthTitle = monthNameZh[monthIndex0] + ' ' + year;
        const rangeMin = movies[0]?.release_date;
        const rangeMax = movies[movies.length-1]?.release_date;

        monthEl.innerHTML = `
          <div class="monthHead">
            <div class="monthTitle">${monthTitle}</div>
            <div class="monthMeta">${rangeMin} ~ ${rangeMax}（共 ${movies.length} 部）</div>
          </div>
          <div class="dow">${dow.map(x => '<div>'+x+'</div>').join('')}</div>
          <div class="days"></div>
        `;

        const daysEl = monthEl.querySelector('.days');

        // Build a lookup by day
        const byDay = new Map();
        for (const m of movies){
          const k = dayKey(m.release_date);
          if (!byDay.has(k)) byDay.set(k, []);
          byDay.get(k).push(m);
        }

        const todayStr = new Date().toISOString().slice(0,10);
        const showMainland = () => document.getElementById('fMainland')?.checked ?? true;
        const showHK = () => document.getElementById('fHK')?.checked ?? true;

        const renderCards = (cards, dateStr) => {
          const filtered = cards.filter(c => {
            const rk = regionKey(c.region);
            if (rk === 'mainland') return showMainland();
            if (rk === 'hk') return showHK();
            return true;
          });

          // Keep cell clean: cap to 3 cards (show "+N" if more).
          const cap = 3;
          const shown = filtered.slice(0, cap);
          const extra = filtered.length - shown.length;

          return `
            ${shown.map(c => {
              const rk = regionKey(c.region);
              const tagClass = rk === 'mainland' ? 'mainland' : (rk === 'hk' ? 'hk' : '');
              const poster = c.poster || '';
              const titleLocal = c.title_local || c.title_en || '';
              const titleEn = c.title_en ? c.title_en : '';
              const link = c.link || '#';
              return `
                <div class="card">
                  <img src="${poster}" alt="${escHtml(titleLocal)}" loading="lazy" />
                  <div class="info">
                    <div class="t">
                      <a href="${link}" target="_blank" rel="noreferrer noopener">
                        <div class="title">${escapeHtml(titleLocal)}
                          ${titleEn && titleLocal !== titleEn ? '<small>'+escapeHtml(titleEn)+'</small>' : '<small>'+escapeHtml(titleEn)+'</small>'}
                        </div>
                      </a>
                      <div class="regionTag ${tagClass}">${escapeHtml(c.region || '')}</div>
                    </div>
                  </div>
                </div>
              `;
            }).join('')}
            ${extra > 0 ? `<div class="moreBtn" data-date="${dateStr}" style="color: rgba(255,255,255,0.65); font-size: 12px; padding-left: 2px; cursor:pointer;">+ ${extra} more</div>` : ''}
          `;
        };

        // Need escaping helpers in renderCards scope.
        function escapeHtml(str){
          return String(str)
            .replace(/&/g,'&amp;')
            .replace(/</g,'&lt;')
            .replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;')
            .replace(/'/g,'&#039;');
        }
        function escHtml(str){ return escapeHtml(str); }

        // Leading blanks
        for (let i=0;i<mondayIndex;i++){
          const cell = document.createElement('div');
          cell.className = 'day muted';
          cell.innerHTML = '<div class="dayNumRow"><div class="dayNum"> </div><div class="count"></div></div><div class="cards"></div>';
          daysEl.appendChild(cell);
        }

        for (let day=1; day<=lastDayNum; day++){
          const dateStr = year + '-' + pad2(monthIndex0+1) + '-' + pad2(day);
          const cards = byDay.get(dateStr) || [];

          const cell = document.createElement('div');
          cell.className = 'day';

          if (dateStr === todayStr) cell.classList.add('today');

          cell.innerHTML = `
            <div class="dayNumRow">
              <div class="dayNum">${day}</div>
              <div class="count">${cards.length ? cards.length : ''}</div>
            </div>
            <div class="cards">${renderCards(cards, dateStr)}</div>
          `;
          daysEl.appendChild(cell);
        }

        return monthEl;
      }

      function render() {
  monthGrid.innerHTML = '';

  // 1. 获取当前系统时间的月份
  const now = new Date();
  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth(); // 0-11

  // 2. 准备当月和下月的日期对象
  const m1 = new Date(currentYear, currentMonth, 1);
  const m2 = new Date(currentYear, currentMonth + 1, 1);

  // 格式化为 "YYYY-MM"
  const k1 = m1.getFullYear() + '-' + String(m1.getMonth() + 1).padStart(2, '0');
  const k2 = m2.getFullYear() + '-' + String(m2.getMonth() + 1).padStart(2, '0');

  // 3. 筛选数据（如果 generatePage.js 已经过滤过，这里其实是双重保险）
  const filtered = MOVIES.filter(m => {
    const k = ymKey(m.release_date);
    return k === k1 || k === k2;
  });

  const grouped = groupByMonth(filtered);
  
  // 4. 强制只按这两个月的顺序循环渲染
  const keys = [k1, k2]; 

  keys.forEach(k => {
    const [y, m] = k.split('-').map(Number);
    const monthIndex0 = m - 1;
    const moviesInMonth = grouped.get(k) || []; // 如果这个月没电影，则为空数组
    
    // 调用原有的 makeMonthCard 函数
    monthGrid.appendChild(makeMonthCard({
      year: y, 
      monthIndex0: monthIndex0, 
      movies: moviesInMonth
    }));
  });
}

      // Filter re-render without losing scroll position.
      document.addEventListener('change', (e) => {
        const t = e.target;
        if (!t || (t.id !== 'fMainland' && t.id !== 'fHK')) return;
        render();
      });
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.moreBtn');
  if (!btn) return;

  const date = btn.dataset.date;
  expandedDays.add(date);

  render();
});

render();
      render();
    </script>
